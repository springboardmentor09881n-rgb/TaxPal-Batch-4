@if (!isLoggedIn()) {
  @if (authView() === 'login') {
    <app-login (navigateToSignup)="setAuthView('signup')"></app-login>
  } @else {
    <app-signup (navigateToLogin)="setAuthView('login')"></app-signup>
  }
} @else {
  <div class="min-h-screen bg-slate-50 flex">
    <!-- Sidebar Navigation -->
    <app-sidebar [activeTab]="activeTab()" (tabChange)="setTab($event)"></app-sidebar>

    <!-- Content Workspace Frame -->
    <div class="flex-grow lg:pl-64 pt-16 lg:pt-0">
      <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        @switch (activeTab()) {
          @case ('dashboard') {
            <app-dashboard (navigateToTab)="setTab($event)"></app-dashboard>
          }
          @case ('transactions') {
            <app-transactions-page></app-transactions-page>
          }
          @case ('budgets') {
            <app-budgets-page></app-budgets-page>
          }
          @case ('tax-estimator') {
            <app-tax-estimator-page></app-tax-estimator-page>
          }
          @case ('reports') {
            <app-reports-page></app-reports-page>
          }
          @case ('settings') {
            <app-settings-page></app-settings-page>
          }
        }
      </main>
    </div>
  </div>
}
